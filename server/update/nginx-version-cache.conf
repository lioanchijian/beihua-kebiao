# 更新清单禁止强缓存；放到站点 server{} 块内或 include 进 beihua 站点。
# 用 expires -1 而不是 add_header Cache-Control，避免覆盖站点级 HSTS 等安全头。
location = /version.json {
    default_type application/json;
    expires -1;
    try_files $uri =404;
}

location = /version-latest.json {
    default_type application/json;
    expires -1;
    try_files $uri =404;
}

# 官网主下载按钮固定指向 latest.apk；文件换版后不能让 CDN/浏览器拿旧包。
location = /download/beihua-kebiao-latest.apk {
    expires -1;
    try_files $uri =404;
}
